[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "flowx-border"
version = "0.1.0"
description = "Inspects the text going into and coming out of an LLM, returns a decision and an evidence record."
requires-python = ">=3.11"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
authors = [{ name = "FlowX.AI" }]
keywords = ["llm", "pii", "prompt-injection", "guardrails", "evidence", "onnx"]
classifiers = [
  "Development Status :: 2 - Pre-Alpha",
  "Intended Audience :: Developers",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Topic :: Security",
  "Typing :: Typed",
]

# The base runtime set is pydantic, pyyaml, onnxruntime, tokenizers, huggingface-hub
# and cryptography. Only the two that phase 0
# needs are declared here. onnxruntime, tokenizers, huggingface-hub and
# cryptography arrive with the phases that first use them.
dependencies = [
  "pydantic>=2.7",
  "pyyaml>=6.0",
  # Phase 3. All three are in the base runtime set above, so no
  # approval was needed. onnxruntime runs the detectors, tokenizers is the fast tokenizer
  # whose character offsets make spans possible at all, and huggingface-hub fetches the
  # weights once. None of them is touched during a scan once a session is warm.
  "onnxruntime>=1.17",
  "tokenizers>=0.15",
  "huggingface-hub>=0.23",
]

# Signing is optional because most callers archive records without signing them, and
# because the library never holds a key: `sign_record` takes one the caller owns.
[project.optional-dependencies]
signing = ["cryptography>=42.0"]
# sql_injection needs a real SQL parser. An extra rather than a base dependency because
# only a text-to-SQL product wants it, and the detector declares
# requires={"dependency"} so a policy enabling it tells the caller. The detector is
# absent from the registry when this is not installed, rather than degraded to a pass.
sql = ["sqlglot>=25"]
# json_schema validates output against a schema the policy carries. Same shape of
# decision as `sql`: only a product with a schema wants it, the detector declares
# requires={"dependency"}, and it is absent rather than degraded when not installed.
schema = ["jsonschema>=4.21"]

[project.urls]
# flowx-ai/border, not flowx-ai/flowx-border. The distribution is named flowx-border and
# the repository is not, and the wrong one was in here until 2026-08-17: it would have
# been baked into the 0.1.0 metadata on PyPI, where a project URL cannot be corrected
# without burning a version number.
Source = "https://github.com/flowx-ai/border"
Documentation = "https://github.com/flowx-ai/border/tree/main/docs"
Issues = "https://github.com/flowx-ai/border/issues"

[dependency-groups]
dev = [
  # Both are optional extras at runtime and dev dependencies here, for the same
  # reason: mypy --strict has to see the code paths that use them, and the tests have
  # to exercise those paths rather than skipping. CI runs `uv sync --locked`, which
  # installs this group and not the extras, so a test that needed an extra and was not
  # listed here would skip in CI while passing locally, which is the quietest way for a
  # check to stop running.
  "cryptography>=42.0",
  "sqlglot>=25",
  "jsonschema>=4.21",
  "fastapi>=0.141.1",
  "httpx>=0.28.1",
  "mypy>=1.11",
  "pytest>=8.0",
  "ruff>=0.6",
  "types-pyyaml>=6.0",
]

[tool.hatch.build.targets.wheel]
packages = ["src/flowx_border"]

[tool.ruff]
line-length = 88
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.format]
# The formatter reads Python code blocks inside markdown, and documentation is where
# that goes wrong. The blocks in docs/ are illustrative rather than executable: the
# Literal table in reference/types.md aligns its right-hand sides so the four values
# read as a set, and the formatter strips that alignment because as Python it is
# redundant whitespace. As documentation it is the point.
#
# Excluded from formatting only. `ruff check` still lints these files, and every .py in
# the repository is still formatted.
exclude = ["docs/**/*.md", "*.md"]

[tool.ruff.lint]
select = [
  "A",    # builtin shadowing
  "ANN",  # annotations, paired with mypy strict
  "ARG",  # unused arguments
  "B",    # bugbear
  "C4",   # comprehensions
  "E",    # pycodestyle
  "F",    # pyflakes
  "I",    # import order
  "N",    # naming
  "PTH",  # pathlib over os.path
  "RUF",
  "S",    # security lint, this is a security library
  "SIM",
  "UP",
  "W",
]

# RUF001/002/003 flag non-ASCII letters that resemble ASCII ones, which is a real
# homoglyph defence in a codebase that is meant to be ASCII. This one is not: Turkish
# dotless i, Azerbaijani schwa, Greek and Cyrillic appear in keyword tables, disclosure
# phrasings and test fixtures because they are what the library reads. Ignored project
# wide rather than per line, since every occurrence is deliberate.
ignore = ["RUF001", "RUF002", "RUF003"]

[tool.ruff.lint.per-file-ignores]
# Tests assert, they poke at private helpers on purpose, and their builders take
# arbitrary field overrides so that one helper can drive a parametrised sweep. ARG002
# is here because a fake detector has to carry the whole Detector signature whether or
# not it reads every argument, and renaming the unused ones to _cfg would leave a
# template that no longer matches the protocol a real detector must implement.
# ARG001 joins them for pytest fixtures. Several tests depend on a fixture purely for
# ordering, so that the shared model session is warmed before they inspect how many
# sessions exist. Requesting the fixture is the only way to express that dependency, and
# renaming it to _pii would stop pytest resolving it.
# B008 is here for FastAPI: `Depends(...)` in a parameter default is that framework's
# documented idiom, and the rule exists to catch a mutable default shared by accident.
# training/ is not shipped: pyproject packages src/flowx_border only, so nothing here
# reaches a wheel. It is exempted from the annotation rules because transformers, torch
# and peft ship no useful types, so every model and tokenizer is Any and annotating them
# would be writing `Any` two hundred times rather than adding information. The library
# itself stays under mypy --strict, which is where the rule earns its keep.
# S311 is here because the randomness is a corpus shuffle seeded from the config for
# reproducibility, which is the opposite of a cryptographic use: a secure generator
# would make the split unrepeatable, and a split that changes is a different
# measurement.
"training/**" = [
  "ANN401", "ANN001", "ANN201", "ANN202", "ANN204", "S101", "T201", "PTH123",
  "S311",
  # ARG002: subclassing transformers.Trainer means matching its signature, and
  # compute_loss takes a **kwargs this override does not read.
  "ARG002",
]
"tests/**" = ["S101", "SLF001", "ANN401", "ARG002", "ARG001", "ARG005", "B008", "ANN001"]

[tool.mypy]
python_version = "3.11"
strict = true
plugins = ["pydantic.mypy"]
# CI checks src, matching the command in BUILD_PLAN.md. Tests get their annotation
# coverage from ruff ANN instead.
files = ["src"]
# A detector that silently returns Any is a detector that silently passes.
warn_unreachable = true
enable_error_code = ["redundant-expr", "truthy-bool", "ignore-without-code"]

# onnxruntime ships no py.typed marker, so strict mode cannot see into it. Scoped to that
# one module rather than relaxed globally: everything the library does with a session is
# still checked, only the library's own type stubs are missing.
[[tool.mypy.overrides]]
module = ["onnxruntime", "onnxruntime.*"]
ignore_missing_imports = true

# jsonschema ships no py.typed marker either. Scoped to that module rather than
# relaxed globally: everything the library does with a validator is still checked.
[[tool.mypy.overrides]]
module = ["jsonschema", "jsonschema.*"]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--strict-markers --strict-config"
markers = [
  "slow: real model weights or latency budgets, excluded from the default run",
  "network: genuinely needs a socket, exempt from the offline guard in conftest",
]
