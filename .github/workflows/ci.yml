# SPDX-License-Identifier: Apache-2.0
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13"]
    steps:
      - uses: actions/checkout@v4

      - uses: astral-sh/setup-uv@v5
        with:
          enable-cache: true

      - name: Install
        run: uv sync --locked --python ${{ matrix.python-version }}

      - name: Lint
        run: uv run ruff check .

      - name: Format
        run: uv run ruff format --check .

      - name: Types
        run: uv run mypy --strict src

      - name: Tests
        # The default selection must pass with no network. tests/conftest.py blocks
        # sockets, and HF_HUB_OFFLINE stops any model cache lookup from dialling out.
        run: uv run pytest -q
        env:
          HF_HUB_OFFLINE: "1"

  style:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: No em-dashes
        # The character is built with printf so that this file does not match itself.
        run: |
          if grep -rn "$(printf '\u2014')" \
              --include="*.py" --include="*.md" --include="*.yaml" \
              --include="*.yml" --include="*.toml" .; then
            echo "Em-dash found. Use a comma, a colon, parentheses or a full stop."
            exit 1
          fi

      - name: SPDX header on every source file
        run: |
          missing=0
          while IFS= read -r file; do
            if ! head -5 "$file" | grep -q "SPDX-License-Identifier: Apache-2.0"; then
              echo "missing SPDX header: $file"
              missing=1
            fi
          done < <(find src tests -name '*.py')
          exit "$missing"
