# The default policy: what a reasonable first install does.
#
# Readable by someone who does not write Python, which is constraint 5 and the reason
# there are no expressions or callbacks in here. Every value is data.
#
# fail_mode is 'open' throughout: a detector that breaks records the breakage as a
# finding and the scan continues. That is the right default for a first install, because
# a library that starts blocking traffic the day a model fails to load will be removed
# rather than fixed. See bfsi.yaml for the opposite choice and why.

policy_id: default
version: 1
description: >
  Balanced starting point. Secrets and missing disclosures are caught, personal data is
  redacted rather than blocked, and the expensive T3 checks run only when something
  cheaper has already found a reason.

fail_mode: open

# Thresholds below are measured, not chosen.
#
# Each one that differs from 0.5 was calibrated on the validation split of the corpus
# that trained the detector, on 2026-08-11, and the value is recorded in the matching
# configs/<detector>.yaml in the training repo with the objective value beside it. This
# matters more than it looks: at 0.5, four of these detectors reported F1 0.000 in all
# 26 languages, because their scores separate positives from negatives well below 0.5.
# A threshold left at a plausible-looking default is how a detector becomes a no-op
# that still produces evidence records.
#
# A detector whose threshold is not listed here has not been calibrated yet, and the
# 0.5 default applies. Treat that as unmeasured rather than as correct.
detectors:
  # T0. Always runs, cannot be disabled.
  secrets:
    on_fail: block          # a leaked credential is not something to flag and forward
  disclosure:
    on_fail: flag           # absence of a disclosure is a reporting matter, not a refusal
  invisible_text:
    on_fail: redact         # strip them; the visible text is unchanged by doing so

  # T1.
  pii:
    on_fail: redact         # redact and continue: the user still gets an answer
    threshold: 0.5
    options:
      entities: [CARD, DATE, EMAIL, IBAN, NATIONAL_ID, PERSON, PHONE]
      # A bare date is not personal data. A date of birth beside a name is, a delivery
      # date is not, and the model cannot tell them apart: measured over 234 ordinary
      # rows in 26 languages on 2026-08-16, `date` put a redaction on 0.594 of them,
      # including `09:00` and a temperature reading of `14-18 C`. Redacting all of that
      # damages text and protects nobody.
      #
      # So it is reported and not removed. `flag` keeps the finding in the record, so a
      # reader can still see a date was present, which dropping DATE from `entities`
      # above would not. A policy that wants dates gone says redact here: see
      # policies/bfsi.yaml, where a date of birth is the likely case and it does.
      entity_actions:
        date: flag
      # `person` is the one type with no shape to check. Every other has one: a checksum
      # for CARD and IBAN, a format for EMAIL and PHONE, a length and a scheme for
      # NATIONAL_ID. So an unfamiliar capitalised token mid-sentence lands in `person` and
      # `entity_shapes.py` has nothing to reject it with. Measured over 234 ordinary rows
      # in 26 languages on 2026-08-19, that is 43 of 51 damaging findings, and the spans
      # are places: `Regensburg`, `Valletta`, `Stenlosevej`, `Kobanya-Kispest`.
      #
      # A bar at 0.90 removes 30 of those 43 and costs nothing measurable:
      #
      #   held-out PERSON recall     1.0000 over 668 gold spans, lowest real person 0.9610
      #   hand-written people        14 of 14 across 8 scripts, lowest 0.9118
      #
      # It is 0.90 rather than 0.95 because 0.95 removes three more and loses that 0.9118
      # Greek honorific, and a missed person is a hole where a redacted place is visible.
      #
      # What survives the bar is mostly places named after people, `Franjo Tudman` at
      # 0.977 and `Deak Ferenc` at 0.962, where the span does contain a person's name.
      #
      # This reverses an earlier finding that a threshold could not help here. That rested
      # on the false positives scoring a median of 0.9416, measured on the artifact
      # superseded on 2026-08-16 and then asserted to still hold rather than re-taken. On
      # the adopted model the median is 0.7392.
      entity_thresholds:
        person: 0.90
        # Added 2026-08-19 from the same sweep, and both are cheaper than `person` was.
        #
        # `national_id` was redacting product model numbers: `EP2237/10` on a Philips
        # espresso machine at 0.992, `LV-EWT2026` on a kettle at 0.833, a `1440` screen
        # resolution at 0.603 and an `0800` freephone prefix at 0.650. It is where the model
        # puts a digit run it does not recognise. A bar at 0.90 removes three of the four
        # and costs nothing at all: held-out recall is 0.8556 at every bar from 0.5 to 0.99,
        # because the distribution is bimodal, a real identifier scores about 0.99 or is
        # missed entirely, and nothing sits between. So this bar is free in a way `person`'s
        # was not, and the 0.144 that goes unfound is a recall problem the bar does not touch.
        #
        # `phone` was redacting `123456` at 0.567 and a municipal notice line at 0.874. 0.90
        # is the ceiling here rather than a choice: at 0.95 held-out recall falls 1.0000 to
        # 0.8368.
        #
        # What no bar can reach is the other two `phone` findings, LIDL's support line at
        # 0.988 and Orange's at 0.991. Those are real phone numbers, correctly tagged, and
        # the question they raise is whether a company's published support line is personal
        # data at all. It is not, and the model cannot tell it from a personal mobile, so
        # that one stays open rather than being papered over with a threshold.
        national_id: 0.90
        phone: 0.90
  output_leakage:
    on_fail: redact
    threshold: 0.5
  encoded_payload:
    on_fail: flag           # see below: new, and flagging first is the cautious order
    threshold: 0.5
    # `flag` rather than `block`, unlike `injection`, and deliberately so for now. The
    # rules are precise and the must-not-fire set is long, but this detector is new and
    # has no field data: a JWT, a git hash and base64 of ordinary prose all decode
    # cleanly and are reported as nothing, which is checked, and none of that is the
    # same as a month of real traffic. A caller who wants the stronger action sets
    # block here in one line, and this default should move to block once there is
    # evidence rather than confidence behind it.
    #
    # The threshold is the knob that matters. At 0.5 the weak set is on, which is the
    # `you are now` family of reframings inside an encoding. Raise it at all and only
    # explicit overrides remain, scored 0.9.
  gibberish:
    on_fail: flag           # cheap, and mostly useful as a signal not a gate
    threshold: 0.37

  # T1, rules, ported from the Guardrails Hub. See
  # docs/porting-guardrails-validators.md.
  #
  # The two list-driven ones are off by default because their entire input is data only
  # the deployer has. Enabled with an empty list they report `terms_not_configured` and
  # `domains_not_configured` on every scan, which is honest and also noise, so the
  # shipped default is off rather than on and complaining.
  banned_terms:
    enabled: false
    on_fail: flag
    options:
      terms: []             # your competitors, your banned words, your product names
      whole_words: true     # false matches substrings, which flags innocent words
      fold_diacritics: false
  internal_domains:
    enabled: false
    on_fail: redact         # a hostname in an answer is worth removing, not refusing
    options:
      domains: []           # corp.internal, wiki.example.corp, and so on
  output_format:
    enabled: false          # shape, not security, and its shape is yours to state
    on_fail: flag
    options: {}
  sql_injection:
    enabled: false          # needs the `sql` extra; only a text-to-SQL product wants it
    on_fail: block          # a statement that does more than asked is not redactable
    options:
      allow: [select]
  postal_code:
    enabled: false          # only the deployment knows which countries it serves
    on_fail: flag           # a wrong postcode is worth reporting, not refusing over
    options:
      countries: []         # ISO codes, for example [ro] or [de, at]
  repetition:
    enabled: false          # a writing-quality check, not a security one
    on_fail: flag
    options:
      similarity: 0.9
  json_schema:
    enabled: false          # needs the `schema` extra and a schema to check
    on_fail: flag
    options: {}
  system_prompt_leakage:
    on_fail: flag           # needs no list: the phrase signal works in all 26 languages
    threshold: 0.5
  language_id:
    enabled: true
    on_fail: flag           # a language question is rarely a reason to refuse an answer
    options:
      # No `allowed` list and no `match_input` by default, so out of the box this only
      # records which language it saw. Both of the questions it can answer need something
      # only the deployer knows: which languages the product serves, and what language the
      # prompt was in. Guessing either would make the detector fire on correct behaviour.
      #
      # To gate on language, add:
      #   allowed: [en, ro]
      # To require the answer match the prompt, add `match_input: true` and pass
      # ctx.metadata['input_language'].
      min_margin: 0.12      # under this the text is called uncertain rather than guessed

  markup_injection:
    on_fail: redact         # remove the executable fragment, keep the answer
    # Left on for a general assistant. Turn it off for a coding assistant, where
    # emitting a <script> tag is the product working rather than failing.

  # T2. May be disabled per policy.
  moderation:
    enabled: false          # see below: measured, and not ready to enforce
    on_fail: flag
    threshold: 0.84         # its own calibration, macro F1 0.931 against 0.923 at 0.5
    # Published, pinned and available, and deliberately off.
    #
    # Measured 2026-08-17 on ten ordinary support questions: it fires on five of them at
    # 0.90 to 0.98. Four account-access questions read as `cyber_intrusion`, including
    # "How do I reset my password?" at 0.97, and "How do I report a suspicious message I
    # received?" reads as `sexual_exploitation` at 0.90. That last one is a user trying
    # to report abuse being labelled as the abuse.
    #
    # Its own evaluation says mean per-language F1 0.9919 and a 0.000 false positive rate
    # on all three mundane registers, and both are true. The registers are informational,
    # operational and transactional prose, and an account-access question is none of
    # those. It is the same missing-register failure as `nsfw` at 55 percent of business
    # prose and `injection` on git hashes, in a third place.
    #
    # So it ships available and off. Enabling it is one line for anyone who wants to
    # evaluate it on their own traffic, and the corpus fix is the account-access register.
  injection:
    on_fail: block
    # Lower than the default: a missed injection costs more than a review. Calibrated
    # on the validation split, 2026-08-11. This key was listed twice with two different
    # values until 2026-08-11; YAML silently keeps the last, so the effective threshold
    # was always this one and removing the dead line changes nothing but the confusion.
    threshold: 0.43
  regulated_advice:
    on_fail: flag           # default install only reports; BFSI blocks, see bfsi.yaml
    threshold: 0.5
  # The four thresholds in this block are the values each model's own calibration.json
  # chose on its validation split, maximising macro F1. They were hand-picked numbers
  # until 2026-08-13, all four well under the calibrated value, and the gap showed up as
  # findings on ordinary text: 18 substantive findings over 20 mundane business
  # sentences, 14 once aligned. bias alone went from 3 of 20 to none.
  #
  # The calibration was computed when each model was trained and written into its
  # training config, and nothing carried it across into this file, so a caller running
  # the shipped default was getting thresholds no measurement supported.
  #
  # Not every threshold in this policy is the calibrated one, and the two that are not
  # are deliberate rather than left over. `injection` at 0.43 and `gibberish` at 0.37 are
  # both above their calibrated 0.26 and 0.05, which makes them less sensitive than macro
  # F1 would like. Neither fires on the mundane set at either value, so the choice costs
  # nothing measurable there and the reasoning stays with each key.
  toxicity:
    on_fail: flag
    # 0.81 from the 2026-08-14 retrain's own validation split, macro F1 0.9894 against
    # 0.9885 at the neutral 0.5. Replaces 0.48, which was the previous model's calibration.
    #
    # The corpus is what moved, not the recipe. Regenerated with the shared mundane
    # registers and length bands: 13,778 examples, length_separation 0.508 and 0.474 against
    # a balanced 0.5, and positives per language up from about 4 to 197 to 209. So a
    # per-language F1 now rests on roughly 20 test examples rather than two, and this
    # detector comes off the single-digit-positives list.
    #
    #     mean per-language F1   0.9604 -> 0.9915
    #     worst language          0.400 -> 0.950 (sv)
    #
    # Fires on 0 of the 20 ordinary sentences at 0.48, at 0.81 and at the neutral 0.5, and
    # on 0 of 20 when they are cut to 55 characters, which is the length probe rather than
    # a second opinion on the same one.
    #
    # Its previous rebuild was refused by the decision-flip gate at a margin of 0.0687
    # against a 0.02 band, which is why the older model shipped. This export passed at
    # 0/300 changed, max drift 0.0432.
    threshold: 0.81
  nsfw:
    # 0.76, calibrated on the 2026-08-14 retrain's own validation split, macro F1 0.9425
    # against 0.9194 at the neutral 0.5.
    #
    # This replaces 0.81, and the reason is the probe below rather than the macro. That
    # model left one of the twenty ordinary sentences firing, and firing as `block`: "El
    # paquete llego a la oficina esta manana", Spanish for a parcel arriving at an office.
    # One refusal in twenty is better than eleven flags and is not acceptable in a
    # guardrail, so the corpus was regenerated again, this time with 2,180 mundane
    # negatives across 26 languages and even length bands, and the model retrained on it.
    #
    #     original at 0.95    11 of 20 fire, median 0.9845
    #     2026-08-13 at 0.81   1 of 20 fire, one of them a block
    #     2026-08-14 at 0.76   0 of 20 fire
    #
    # Measured through scan_output with this policy, not through a bespoke scoring script.
    # That distinction earned itself: a raw ONNX harness written to compare the two models
    # reported the 2026-08-13 artifact as clean on the same sentence it demonstrably
    # blocks, because it did not reproduce what the detector does around inference. The
    # library's own path is the only one whose numbers mean anything here.
    #
    # And 0 of 20 holds at 0.81, at 0.76 and at the neutral 0.5, which is the part worth
    # trusting: the margin is in the model rather than in the threshold.
    #
    # Superseded, kept because the reasoning still reads: 0.81 was calibrated on the
    # 2026-08-13 retrain's validation split, macro F1 0.9184 against 0.9085 at 0.5.
    #
    # This replaces 0.95, and the reason is worth keeping. At 0.95 the previous model
    # fired on 11 of 20 ordinary business sentences at a median score of 0.9845, while
    # its own test negatives scored 0.0005. No threshold fixed that, because the cause
    # was the corpus: every negative in it was a long, topic-adjacent boundary case (art
    # history, clinical prose, breastfeeding), so positives were systematically shorter
    # than negatives at 0.964 on the separation metric, and mundane prose was out of
    # distribution on both length and topic at once.
    #
    # The corpus was rebuilt on 2026-08-13 with length bands crossed over every register
    # and three mundane negative registers added, taking separation to 0.552, and the
    # model retrained on it. Same 20-sentence probe, same wording:
    #
    #     old model at 0.95   11 of 20 fire, median 0.9845
    #     new model at 0.81    1 of 20 fire, median 0.0080
    #
    # That one was "El paquete llego a la oficina esta manana" at 0.9218, and it was
    # defended here as possibly not a false positive, on the grounds that `paquete` is
    # Spanish slang for male genitals and the model might be reading a real ambiguity.
    #
    # **The defence does not survive the disambiguating cases, and the 2026-08-14 model
    # settles it.** Same detector, same policy:
    #
    #     paquete as a parcel, delivered to an office        no finding
    #     paquete as a parcel, left at reception             no finding
    #     paquete as genitals, described on a body           sexual 0.9970
    #     paquete as genitals, an unsolicited photo          sexual 0.9971
    #     an explicit request, no ambiguous word at all      sexual 0.9980
    #     clinical testicular pain and an ultrasound         no finding
    #
    # So the word is read in context rather than ignored, which is the outcome that was
    # wanted and not the one that would follow from a blunter model. The old behaviour was
    # a false positive: it fired on the parcel sense.
    #
    # `on_fail` stays at block, and that is now defensible on evidence rather than
    # deferred: nothing in the ordinary set reaches the threshold at 0.81, at 0.76, or at
    # the neutral 0.5.
    on_fail: block
    threshold: 0.76
  bias:
    on_fail: flag
    # 0.77 from the 2026-08-17 retrain's own validation split, macro F1 0.982 against
    # 0.981 at the neutral 0.5. Replaces 0.57, which replaced 0.84.
    #
    # That retrain is nine times the corpus, 36,407 rows against 4,901, same architecture
    # and same hyperparameters so the difference is attributable. Mean per-language F1
    # 0.9771 -> 0.9826 and worst language 0.824 -> 0.942, export 0/300 at p99 probability
    # drift 0.00081.
    #
    # **The support is the change and the score is not.** ~80 test examples per language
    # against ~9, so a per-language figure now moves by a point where it moved by eleven.
    # 0.9771 was never wrong, it was unmeasurable.
    #
    # One weakness the bigger corpus made visible: `inclusive_phrasing` has a false
    # positive rate of 0.096, so text that deliberately uses inclusive language reads as
    # bias about one time in ten. That register had no measurable support before, so this
    # is newly visible rather than newly true. It is why this stays at `flag`.
    threshold: 0.77
  politeness:
    enabled: false          # off by default: a style check that blocks is a support ticket
    on_fail: log
    threshold: 0.89

  # T3. Runs only on escalation unless 'always' is set.
  url_reachability:
    enabled: false          # leaves the machine; see registry.deployment_notes
    on_fail: flag           # a dead link is worth reporting, not worth refusing over
    options:
      deadline_ms: 2000     # total for the whole detector, not per URL
      max_urls: 5
  topic_scope:
    on_fail: flag
    threshold: 0.45
  groundedness:
    enabled: false          # published and available, deliberately off. See below.
    on_fail: flag
    options:
      grounded_min: 0.78    # the scheme's own bar; see below for what picked it
    # Published at flowxai/groundedness on 2026-08-17 and disabled the same day, which is
    # not a contradiction: what earned it publication is not its accuracy.
    #
    # Against 42 hand-written probes, with the deterministic rule layer in front, it is
    # right 0.7381 of the time. Roughly one call in four is wrong, against one in twenty
    # on its generator's own held-out split, and the gap between those two numbers is the
    # honest state of this detector rather than a range to pick from.
    #
    # It was published because it is the only one of seven candidates whose verdict
    # depends on the source it was given. Same candidate, three sources: 0.7681 against a
    # source that contradicts it, 0.0070 against an unrelated passage in another language,
    # 0.8365 against one that states it outright. The best three-way candidate answered
    # 0.9991, 0.9994 and 0.0007 to those, which is inverted and source-blind.
    #
    # The failure direction is toward caution. A claim weaker than its source reads
    # not_grounded at 0.8625, so a caller who enables this gets false alarms rather than
    # missed contradictions. That is the right way round for a guardrail and still a cost,
    # which is why the default is off and the recommendation is to measure it on your own
    # traffic before turning it on.
    #
    # grounded_min supersedes `threshold` for this detector, so no `threshold` is set
    # here: setting both would be two bars with contradictory meanings, and a sentence
    # just under the grounded bar has a correspondingly small not-grounded score.
