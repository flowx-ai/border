# BFSI: banking, financial services and insurance.
#
# The differences from default.yaml are all in one direction, and each has a reason:
#
#   fail_mode closed for T0 and T1  an unavailable check is a failed check. In a
#                                   regulated context, "we could not tell" is not an
#                                   answer you can put in front of a supervisor.
#   regulated_advice blocks         this is the whole reason the file exists
#   every detector enabled          including the ones default.yaml leaves off
#   groundedness always: true       claims about a customer's money get checked against
#                                   their sources every time, not on escalation
#
# T2 and T3 stay open on purpose. Failing closed on a 300 ms model that did not load
# would take the whole assistant down, and the T0/T1 floor already holds.

policy_id: bfsi
version: 1
description: >
  For regulated financial contexts. Fails closed on the cheap tiers, blocks regulated
  advice, and grounds every outbound claim against its sources.

fail_mode:
  T0: closed
  T1: closed
  T2: open
  T3: open

detectors:
  secrets:
    on_fail: block
  disclosure:
    on_fail: block          # a missing AI disclosure is itself a compliance finding here
  invisible_text:
    on_fail: block          # smuggled instructions are not something to redact and forward

  pii:
    on_fail: redact
    threshold: 0.4          # lower threshold: prefer over-redaction to a leak
    options:
      entities: [CARD, DATE, EMAIL, IBAN, NATIONAL_ID, PERSON, PHONE]
      # No `entity_actions` here, deliberately, so DATE stays at the `redact` above.
      # policies/default.yaml drops DATE to `flag` because a delivery date is not
      # personal data and redacting every date damages ordinary text. In this sector a
      # date next to a name is usually a date of birth, and the line above already says
      # over-redaction is the preferred error, so the divergence is the point rather
      # than an omission.
      #
      # No `entity_thresholds` either, for the same reason and it is worth stating rather
      # than leaving as an absence. default.yaml puts a 0.90 bar on PERSON because an
      # unfamiliar capitalised token mid-sentence lands there and place names were being
      # redacted out of ordinary prose. That bar cost nothing measurable, 1.0000 recall
      # over 668 held-out spans, but "nothing measurable" is not "nothing", and the
      # trade it makes is a small risk of a missed person against a visible
      # over-redaction. This policy has already chosen the other side of exactly that
      # trade twice, in the threshold above and in the DATE decision, so it takes the
      # over-redaction here too.
  output_leakage:
    on_fail: block          # personal data on the way out is a reportable event
    threshold: 0.4
  gibberish:
    on_fail: flag
    threshold: 0.7

  # Enabled with empty lists on purpose, which is the opposite of default.yaml's choice
  # and follows from this file's philosophy rather than contradicting it. Until you fill
  # these in, every evidence record carries `terms_not_configured` and
  # `domains_not_configured` at action `log`. In a regulated context that line is the
  # useful artifact: it is an enabled control with no configuration, visible to whoever
  # reads the record, rather than a control that is quietly absent. Fill them in and the
  # lines go away.
  banned_terms:
    enabled: true
    on_fail: block          # a term list here is usually a prohibited-recommendation list
    options:
      terms: []             # fill in: sanctioned entities, prohibited product names
      whole_words: true
  internal_domains:
    enabled: true
    on_fail: block          # topology in an outbound answer is a reportable event
    options:
      domains: []           # fill in: your internal hostnames
  output_format:
    enabled: false          # nothing here is a compliance control
    on_fail: flag
    options: {}
  sql_injection:
    enabled: false          # enable with allow: [select] if you generate SQL
    on_fail: block          # a statement that does more than asked is not redactable
    options:
      allow: [select]
  postal_code:
    enabled: false          # set countries to the markets you operate in
    on_fail: flag           # a wrong postcode is worth reporting, not refusing over
    options:
      countries: []         # ISO codes, for example [ro] or [de, at]
  repetition:
    enabled: false          # a writing-quality check, not a security one
    on_fail: flag
    options:
      similarity: 0.9
  json_schema:
    enabled: false          # needs the `schema` extra and a schema to check
    on_fail: flag
    options: {}
  system_prompt_leakage:
    on_fail: block          # the instructions behind a regulated assistant are not public
    threshold: 0.4          # lower than default: prefer a false positive to a leak
  language_id:
    enabled: true
    on_fail: flag           # a language question is rarely a reason to refuse an answer
    options:
      # No `allowed` list and no `match_input` by default, so out of the box this only
      # records which language it saw. Both of the questions it can answer need something
      # only the deployer knows: which languages the product serves, and what language the
      # prompt was in. Guessing either would make the detector fire on correct behaviour.
      #
      # To gate on language, add:
      #   allowed: [en, ro]
      # To require the answer match the prompt, add `match_input: true` and pass
      # ctx.metadata['input_language'].
      min_margin: 0.12      # under this the text is called uncertain rather than guessed

  markup_injection:
    on_fail: block

  moderation:
    enabled: false          # available and off: see the note in policies/default.yaml
    on_fail: block          # the action this sector would want, once it can be enabled
    threshold: 0.84
  encoded_payload:
    on_fail: block          # an encoded instruction override is not a review item here
    threshold: 0.5
  injection:
    on_fail: block
    threshold: 0.35
  regulated_advice:
    on_fail: block          # the reason this policy exists
    threshold: 0.4
  toxicity:
    on_fail: block
    threshold: 0.5
  nsfw:
    on_fail: block
    threshold: 0.5
  bias:
    on_fail: block
    threshold: 0.77
  politeness:
    enabled: true
    on_fail: flag

  # Disabled even here, and especially here. Every scan would put a third party in
  # the request path of a regulated assistant, and this file fails T1 closed, so an
  # outage at that third party would become an outage here.
  url_reachability:
    enabled: false
    on_fail: flag

  topic_scope:
    on_fail: block
    # 0.85, raised from 0.45 on 2026-08-19. See policies/default.yaml for the measurement.
    #
    # This policy prefers caution everywhere else and takes the same bar here, because
    # below 0.85 the threshold stops discriminating rather than becoming cautious. At the
    # old 0.45 every one of 408 test rows cleared it, including all 78 that belong to no
    # taxonomy node, and with `on_fail: block` that is a refused response for an input the
    # detector had no opinion about. Caution and noise are different things, and only the
    # first is worth buying.
    threshold: 0.85
  groundedness:
    enabled: false          # the intent below is kept, and it is not ready to enforce
    always: true            # every outbound claim, every time, once it can be trusted
    on_fail: block
    options:
      grounded_min: 0.78
    # The one entry in this file whose intent and setting disagree, on purpose.
    #
    # A policy for regulated financial output wants every outbound claim checked against
    # its source, and this is the detector for that. It is off because the available model
    # is right 0.7381 of the time on hand-written probes and its errors run toward false
    # not_grounded: a claim weaker than its source reads not_grounded at 0.8625. With
    # `on_fail: block` and `always: true` that is a policy which refuses roughly one
    # legitimate claim in four, which is worse for a bank than not checking.
    #
    # Kept configured rather than deleted so the intent survives the model: when a
    # candidate clears the hand-written probe set, this becomes a one-line change and the
    # reason it was ever off stays readable. See policies/default.yaml for the full
    # measurement.
