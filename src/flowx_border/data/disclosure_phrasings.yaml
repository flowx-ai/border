# SPDX-License-Identifier: Apache-2.0
#
# Phrasings that count as an AI disclosure, per language.
#
# Data, not code, for the same reason policy is: someone who has to decide whether their
# product's disclosure wording is accepted should be able to read and edit this file
# without touching Python, and add their own house wording to it.
#
# What this file is for, precisely. The library detects whether a disclosure is present
# in the output. It does not decide whether your disclosure is legally adequate, and
# nothing here should be read as saying a matched phrase satisfies any obligation. See
# the compliance language section of CLAUDE.md.
#
# Matching is on word boundaries, casefolded, over whitespace-collapsed text. Word
# boundaries matter: a bare substring search for "ai" matches "said", "again" and
# "email", which would report a disclosure in almost any English text.
#
# `reviewed` is the honest field. It is false everywhere below, because these phrasings
# were written from general knowledge of each language and not checked by a native
# speaker of it. A false value means: this will match the obvious wording and may miss
# idiomatic wording, so add your own phrasings rather than trusting the list. Flip a
# language to true only after someone who speaks it has read the entry, and say who in
# `reviewed_by`.
#
# Inflection is why several languages list the same noun phrase more than once. Polish
# caught this: a disclosure agreeing with `odpowiedź` reads "wygenerowana ... sztuczną
# inteligencję", accusative, and a file listing only the nominative misses it and reports
# a compliant output as undisclosed. Where a language declines, the case forms a
# disclosure sentence actually uses are listed. This is enumeration, not morphology, so
# an unusual construction can still be missed: that is what options.extra_phrasings is
# for, and it is the main reason `reviewed` matters.
#
# Phrases are fragments on purpose. "generated by ai" matches "This answer was generated
# by AI." and "Generated by AI assistant." A whole sentence would match neither.

