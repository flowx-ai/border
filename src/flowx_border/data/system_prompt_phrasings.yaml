# SPDX-License-Identifier: Apache-2.0
#
# Phrases by which a model announces its own instructions, per language.
#
# The companion signal to the verbatim comparison in
# detectors/system_prompt_leakage.py. That one answers "did the output repeat the
# system prompt", which needs the system prompt to compare against and catches only
# quotation. This one answers "did the output talk about having instructions at all",
# which needs nothing, works when no system prompt was supplied, and catches the leak
# that a comparison cannot: a paraphrase.
#
# Two strengths, because they are different claims
# ------------------------------------------------
#
# `strong` names the system prompt or the system message explicitly. In an assistant's
# answer to a user there is close to no innocent reason to say it, so it scores 0.9.
#
# `weak` refers to having been instructed, without naming the mechanism. "my
# instructions" is a real signal and it is also something an ordinary answer can say for
# ordinary reasons, for example an assistant relaying a form's instructions to the user.
# It scores 0.5, which is exactly the default threshold, so raising the threshold at all
# turns the weak set off. That is the intended knob rather than an accident of the
# number.
#
# Matching is on word boundaries, casefolded, whitespace collapsed, over text folded by
# detectors/multilingual.py. So a phrase listed once here matches every casing, matches
# across a line break, matches with a zero-width character inserted into it, and in
# Romanian matches whether the writer used the comma-below or the cedilla spelling.
#
# `reviewed` is the honest field, and it is false for all 26. These were written from
# general knowledge of each language, not by a native speaker of it. False means: this
# will match the obvious phrasing and will miss idiomatic phrasing, so add your own
# through options.extra_phrasings rather than treating the list as complete. Flip a
# language to true only after someone who speaks it has read the entry, and record who
# in `reviewed_by`.
#
# Fragments, not sentences, for the same reason the disclosure file uses fragments: a
# whole sentence matches nothing, because no two models phrase it identically.

