# SPDX-License-Identifier: Apache-2.0
#
# Absolute quantifiers: words that turn a qualified statement into an unconditional one.
# Used by detectors/claim_conflict.py, which reports `scope_widened` when the only content
# word a candidate adds to its source is one of these.
#
# Why an incomplete list is safe here, which is not true of every data file in this package.
# This file is only ever matched against, never generated from. A word that is missing means
# a widened claim goes unreported, which is exactly the behaviour without the rule at all. A
# word that is wrongly present would cause a false `scope_widened`, so the lists are kept to
# words whose absolute sense is unambiguous rather than made exhaustive.
#
# `reviewed: true` means a native speaker has checked the list. Everything except English is
# false, and the honest reading of that is that the rule is strongest in English today. Do
# not infer from `reviewed: false` that the entries are wrong, only that nobody has confirmed
# they are complete.
#
# Deliberately excluded, and worth recording so they are not added later by reflex:
#   - "only", "just": these narrow rather than widen, so their appearance is the opposite
#     signal and belongs to a different rule.
#   - "most", "many", "usually", "generally": hedges, not absolutes. A source saying
#     "usually free" and a candidate saying "free" is a real conflict, but it is the
#     dropped-qualifier shape, which lexical containment cannot settle. See the module
#     docstring for why that direction was refused.

version: 1

languages:
  en:
    reviewed: true
    words: [all, every, always, never, none, any, each, entirely, wholly, fully,
            unconditionally, unlimited, absolutely, invariably, whatsoever]
  bg:
    reviewed: false
    words: [всички, всеки, всяка, всяко, винаги, никога, никакви, изцяло, напълно,
            неограничен, безусловно]
