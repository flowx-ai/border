# SPDX-License-Identifier: Apache-2.0
#
# Phrases by which text tries to replace the instructions a model is operating under,
# per language.
#
# Written for detectors/encoded_payload.py, which decodes a base64, hex, percent or
# rot13 run and asks what is inside it. It is deliberately a separate file from
# data/system_prompt_phrasings.yaml, because the two answer opposite questions about
# opposite directions:
#
#   system_prompt_phrasings   an assistant saying it has instructions      output side
#   this file                 text telling an assistant to drop them       input side
#
# A phrase belongs here when somebody is issuing the instruction, and there when
# somebody is disclosing it.
#
# Two strengths, because they are different claims
# ------------------------------------------------
#
# `strong` is an explicit override: it names the prior instructions and asks for them to
# be ignored, forgotten or replaced. In ordinary prose, encoded or not, there is close to
# no innocent reason to write it, so it scores 0.9.
#
# `weak` reframes the assistant without naming its instructions: "you are now", "pretend
# that you are". These appear in legitimate prompts constantly, which is why they are
# weak, and why they score 0.5. That is exactly the default threshold, so raising the
# threshold at all turns the weak set off. That is the intended knob rather than an
# accident of the number.
#
# **The weak set is only ever consulted inside decoded content.** A reader who moves
# these phrases into a detector that scans plain text will produce a false positive on
# every prompt that legitimately says "you are a helpful assistant". What makes them
# worth acting on here is the encoding: ordinary text does not base64 its own role
# instruction. The encoding is the signal and the phrase is the confirmation.
#
# Matching is on word boundaries, casefolded, whitespace collapsed, over text folded by
# detectors/multilingual.py. So a phrase listed once matches every casing, matches across
# a line break, matches with a zero-width character inserted into it, and in Romanian
# matches whether the writer used the comma-below or the cedilla spelling.
#
# `reviewed` is the honest field and it is false for all 26. These were written from
# knowledge of each language rather than checked by a native speaker, and the field says
# so rather than the file implying a review that did not happen. A false positive here
# costs a flag on an encoded blob; a false negative costs a missed override. Both are
# worth a review this file has not had.

